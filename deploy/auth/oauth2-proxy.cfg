# oauth2-proxy: the front door of the web page. GitHub sign-in; only the
# emails in authenticated-emails.txt get through (oauth2-proxy reads the
# account's verified primary email). Telegram does not go through here. Runs as a sidecar next to the app
# (deploy/k8s/base/deployment.yaml), so the app is reachable only via this
# proxy and can trust the X-Forwarded-Email header it sets.
#
# Secrets come from env (Secret "oauth2-proxy"):
#   OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
# The public URL comes from env in the overlay: OAUTH2_PROXY_REDIRECT_URL

http_address = "0.0.0.0:4180"
reverse_proxy = true
upstreams = ["http://127.0.0.1:8080/"]

provider = "github"
scope = "user:email"
email_domains = []
authenticated_emails_file = "/etc/oauth2-proxy/authenticated-emails.txt"
skip_provider_button = true

# Sets X-Forwarded-Email (and strips any copy sent by the client).
pass_user_headers = true
pass_access_token = false

# Stay signed in on the phones for 30 days.
cookie_name = "_movin"
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "720h"
cookie_refresh = "1h"

# Probes, plus the home-screen icon and manifest (the app serves these
# without a user too).
skip_auth_routes = [
  "GET=^/healthz$",
  "GET=^/readyz$",
  "GET=^/manifest\\.webmanifest$",
  "GET=^/(icon\\.svg|icon-192\\.png|icon-512\\.png|apple-touch-icon\\.png)$",
]

# Chat turns can take a while; SSE streams stay open (the app sends a
# heartbeat every 25 s and the browser reconnects if one drops).
upstream_timeout = "300s"
flush_interval = "100ms"

request_logging = true
silence_ping_logging = true
