apiVersion: apps/v1
kind: Deployment
metadata:
  name: movin
  labels: { app: movin }
spec:
  # One replica, and it must stay one: Telegram allows a single getUpdates
  # poller per bot token (a second gets 409), and SSE fan-out is per
  # process. Recreate so two never overlap during a rollout (and so the
  # ReadWriteOnce volume is released before the next pod mounts it).
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: movin }
  template:
    metadata:
      labels: { app: movin }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # The kubelet applies fsGroup to the data volume at mount time; with
        # OnRootMismatch it skips the recursive chown once the volume root
        # already has the right group, so a restart does not walk the volume.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: movin:latest
          args: ["serve"]
          env:
            # Localhost only: nothing but the oauth2-proxy sidecar can reach
            # the app, so the X-Forwarded-Email header can be trusted.
            - { name: LISTEN_ADDR, value: "127.0.0.1:8080" }
            # Node's old-space target, below the limit: the PDF tools
            # (poppler) run as child processes in the same memory limit.
            - { name: NODE_OPTIONS, value: "--max-old-space-size=256" }
            # The durable harness's SQLite file (plan.md · Storage).
            - { name: DATA_DIR, value: "/data" }
          envFrom:
            - configMapRef: { name: movin-config }
            - secretRef: { name: movin-secrets }
            # The restore id after a volume restore (velero.md); applied by
            # the runbook, so it is normally absent.
            - configMapRef: { name: movin-restore, optional: true }
          # Measured on the production image with documents on (T6.1,
          # progress.md): idle 57 MB of the 384Mi cgroup (Node RSS 117 MB), a
          # probe adds 47 MB, a small PDF render 2 MB. The 256 MB heap cap
          # sits below the limit; poppler's children share it.
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { memory: 384Mi }
          livenessProbe:
            # The app listens on 127.0.0.1, so this is an exec of the same
            # `healthcheck` the Go binary had. Node has to load the import
            # graph before it can make the request: the default 1 s timeout
            # is too short for a cold probe (T6.1 measured it).
            exec: { command: ["node", "/srv/app/src/main.ts", "healthcheck"] }
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Chat history, durable tasks and the start counter: the PVC in
            # pvc.yaml, deployed by Flux with the rest.
            - { name: data, mountPath: /data }

        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
          args: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
          envFrom:
            - secretRef: { name: oauth2-proxy }
          env:
            - { name: OAUTH2_PROXY_REDIRECT_URL, value: "https://board.example.com/oauth2/callback" }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            # Passes through to the app's /readyz (skip_auth_routes), so the
            # pod is ready only when the app can read S3.
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: oauth2-proxy-config, mountPath: /etc/oauth2-proxy, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
        - name: data
          persistentVolumeClaim: { claimName: movin-data }
        - name: oauth2-proxy-config
          configMap: { name: oauth2-proxy-config }
