apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: movin
  annotations:
    # NKP rewrites OCIRepositories to go through its registry mirror with its
    # own credentials; this one pulls the public artifact from ghcr.io itself.
    nkp.nutanix.com/skip-oci-registry-patches: "true"
spec:
  interval: 5m
  url: oci://ghcr.io/rhapsody008/movin-tracker-deploy
  ref:
    # The newest v2 release (T6.6 cutover). Prereleases like 2.0.1-rc.1 don't
    # match. Roll back: an exact version, e.g. "2.0.0"; restore ">=2.0.0"
    # after a fixed release. Back to v1 ("1.0.1") deletes the chat-history
    # PVC (v1's release has none, and Flux prunes it). (semver wins over tag,
    # so don't add a tag: here.)
    semver: ">=2.0.0"
