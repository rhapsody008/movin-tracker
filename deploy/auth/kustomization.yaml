# oauth2-proxy config as a ConfigMap. Included by deploy/k8s/base.
# Replace the placeholder emails in authenticated-emails.txt (and keep
# ALLOWED_EMAILS in the app's ConfigMap in step: the app checks too).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: oauth2-proxy-config
    files:
      - oauth2-proxy.cfg
      - authenticated-emails.txt
