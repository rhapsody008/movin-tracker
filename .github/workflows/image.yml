# Test, then build the production image and push it to GHCR; on a release
# tag, also publish the rendered manifests that Flux deploys. The app is the
# TypeScript service under app/ (app/Dockerfile) and its tests run in
# app/Makefile's containers; the Go v1 tree was deleted in T7.1, so the job
# that used to run `go test` now only checks the manifests.
#
#   pull request     -> manifests + ts-test + build (no push)
#   push to main     -> ghcr.io/<owner>/<repo>:main, :sha-<short>, :latest
#   tag v2.0.0       -> ghcr.io/<owner>/<repo>:2.0.0, :2.0, :sha-<short>
#                       + ghcr.io/<owner>/<repo>-deploy:2.0.0 (deploy/render.sh,
#                         image pinned by digest; deploy/flux picks it up)
#   tag v2.0.0-rc.1  -> the same, but Flux ignores prereleases (a rehearsal)
#
# A v1.* tag is refused here: a tag builds from its own tree, so a v1 tag on
# main would publish the v2 manifests to a v1 deployment. v1 is tag `v1.0.1`;
# hotfix 1.0.x from a release/1.0 branch cut at it, which keeps the v1 tree.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same version as `kubectl kustomize` locally; sha256 from the release's checksums.txt.
  KUSTOMIZE_VERSION: v5.8.1
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The first job, so a v1 tag is refused before anything is built. It also
  # renders both kustomizations: broken manifests fail here, not at release.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a v1 tag on the v2 tree
        if: startsWith(github.ref, 'refs/tags/v1.')
        run: |
          echo "tag v1 hotfixes from release/1.0" >&2
          exit 1

      - uses: actions/checkout@v5

      - name: Install kustomize
        run: &kustomize |
          curl -fsSLo /tmp/kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tgz" | sha256sum -c -
          tar -xzf /tmp/kustomize.tgz -C /usr/local/bin kustomize

      - name: Render the manifests
        run: |
          kustomize build deploy/k8s/overlays/prod > /dev/null
          kustomize build deploy/flux > /dev/null

  # The app under app/. Everything runs in Docker (app/Makefile: Biome, tsc,
  # vitest with the S3 half against the compose MinIO), so the runner needs
  # nothing installed but make and Docker.
  ts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The compose MinIO has no healthcheck: start it first and wait, so the
      # S3 tests never race its startup on a fresh runner.
      - name: Start MinIO
        run: |
          docker compose --profile tools up -d minio
          for _ in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done

      - name: Lint and test the TypeScript app
        run: make -C app lint test

  image:
    needs: [manifests, ts-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The multi-arch index digest the release pins.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      # The runtime stage runs apk (poppler) for each platform.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # The converter tests on the exact poppler the image ships. linux/amd64
      # only: prod is amd64 (all 7 nodes, checked for T7.1).
      - name: Poppler tests on the production runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          target: poppler-test
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=app-poppler
          cache-to: type=gha,mode=max,scope=app-poppler

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  # Release only: render the prod manifests with the image pinned by digest
  # and publish them as an OCI artifact. Never commits to the repo.
  deploy-artifact:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Install kustomize
        run: *kustomize

      - uses: fluxcd/flux2/action@v2.8.8
        with:
          version: 2.8.8

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render
        run: deploy/render.sh "${{ needs.image.outputs.digest }}" out

      - name: Push the deploy artifact
        run: |
          flux push artifact "oci://ghcr.io/${{ github.repository }}-deploy:${GITHUB_REF_NAME#v}" \
            --path=./out \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"
