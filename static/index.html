<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project LTM</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project LTM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#211B17" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --sunk:#E3E8E6; --ink:#1C2321; --muted:#5D6965; --line:#D3DAD7;
  --admin:#4F74AD; --reno:#B8891F; --shopping:#8A5A9E;
  --brass:#C9A44C; --brass-ink:#3A2E10; --focus:#2F6FEB; --danger:#B9483F;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#211B17; --surface:#2C241F; --sunk:#362D27; --ink:#F2EAE1; --muted:#B8AA9C; --line:#4A3E35;
    --admin:#7FA0D6; --reno:#D9AE4A; --shopping:#B98BCB;
    --brass:#D4B25F; --brass-ink:#241C08; --focus:#7AA5FF; --danger:#E07A70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211B17; --surface:#2C241F; --sunk:#362D27; --ink:#F2EAE1; --muted:#B8AA9C; --line:#4A3E35;
  --admin:#7FA0D6; --reno:#D9AE4A; --shopping:#B98BCB;
  --brass:#D4B25F; --brass-ink:#241C08; --focus:#7AA5FF; --danger:#E07A70; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
.wrap{max-width:1440px;margin:0 auto;padding:20px clamp(14px,3vw,32px) 40px}
.banner{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;color:var(--muted)}
.banner:empty{display:none}

/* header */
header.top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:22px}
.title h1{font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-0.02em}
.money{display:flex;gap:22px;margin-top:8px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.money b{color:var(--ink);font-weight:700}

/* key tag: the one loud element */
.keytag{position:relative;display:flex;align-items:center;gap:14px;background:var(--brass);color:var(--brass-ink);
  border:0;border-radius:14px 44px 44px 14px;padding:12px 26px 12px 18px;cursor:pointer;text-align:left;min-width:230px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.keytag::after{content:"";position:absolute;right:16px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;
  background:var(--bg);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.keytag .n{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-0.03em}
.keytag .l{font-size:14px;line-height:1.3;padding-right:22px}
.keytag .l span{display:block;opacity:.8}

/* next up */
.nextup{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scroll-snap-type:x proximity}
.nextup:empty{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;max-width:260px}
.chip .d{font-size:13px;color:var(--muted)}
.chip .d.late{color:var(--danger);font-weight:700}
.chip .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{background:var(--sunk);border-radius:12px;padding:12px;min-height:200px}
.colhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.colhead h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.colhead h2::before{content:"";width:12px;height:18px;border-radius:3px;background:var(--c)}
.colhead .count{color:var(--muted);font-size:14px}
.add{border:1px dashed var(--line);background:transparent;border-radius:8px;width:100%;padding:8px;color:var(--muted);cursor:pointer;margin-top:4px}
.add:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--surface);border-radius:9px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);position:relative}
.card.done .ct{text-decoration:line-through;color:var(--muted)}
.card.archived{opacity:.55}
.ct{font-weight:700;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%;display:block}
.cm{font-size:13.5px;color:var(--muted);margin-top:3px}
.cm.late{color:var(--danger);font-weight:700}
.crow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.status{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:2px 10px;font-size:13px;cursor:pointer}
.status[data-s="doing"]{border-color:var(--c);color:var(--c);font-weight:700}
.status[data-s="done"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.restore{font-size:13px;background:none;border:0;color:var(--focus);cursor:pointer;padding:0}
.foot{margin-top:16px;display:flex;gap:16px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

/* calendar */
.cal{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;scroll-margin-top:16px}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.calhead h2{font-size:22px}
.calnav{display:flex;gap:6px}
.calnav button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 12px;cursor:pointer}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:13px;color:var(--muted);padding:0 6px 4px}
.cell{background:var(--bg);border-radius:8px;min-height:96px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:1px solid transparent;text-align:left;font:inherit;color:inherit}
.cell.out{opacity:.4}
.cell.today{border-color:var(--ink)}
.cell .dn{font-size:13px;color:var(--muted)}
.cell.today .dn{color:var(--ink);font-weight:700}
.ev{font-size:12.5px;line-height:1.3;border-left:3px solid var(--c);background:var(--surface);border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:0;border-right:0;border-bottom:0;cursor:pointer;text-align:left;width:100%;font-family:inherit;color:inherit}
.ev.done{text-decoration:line-through;color:var(--muted)}
.ev.ms{background:var(--brass);color:var(--brass-ink);border-left-color:var(--brass);font-weight:700}
.more{font-size:12px;color:var(--muted)}
.agenda{display:none}
.agenda .day{padding:8px 0;border-top:1px solid var(--line)}
.agenda .day h3{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:700;margin-bottom:4px}
.agenda .ev{white-space:normal;font-size:14.5px;padding:5px 8px;margin-bottom:4px}
.agenda .empty{color:var(--muted)}
@media (max-width:700px){ .grid7{display:none} .agenda{display:block} }

/* chat */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;
  height:min(78vh,760px);position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.chat header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.chat header h2{font-size:18px}
.log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--surface);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.msg .ch{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.hint button{display:block;margin-top:8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;width:100%;font-size:14px;color:var(--ink)}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);min-height:42px;max-height:140px}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--ink);color:var(--surface);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);display:none}
.fab{display:none}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,14,13,.45)}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h3{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
label input,label select,label textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);width:100%}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.actions div{display:flex;gap:8px}

@media (max-width:1100px){
  .main{grid-template-columns:minmax(0,1fr)} /* minmax: let the sideways-scrolling board shrink instead of widening the page */
  .chat{position:fixed;inset:0;height:100%;border-radius:0;z-index:20;display:none;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .chat.open{display:flex}
  .x{display:block}
  .fab{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;
    box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:30px;padding:12px 20px}
}
@media (max-width:820px){
  header.top{grid-template-columns:1fr}
  .board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:8px}
  .col{flex:0 0 84%;scroll-snap-align:start}
}
@media (prefers-reduced-motion:no-preference){
  .card,.chip{transition:border-color .15s}
}
</style>
<style>
/* additions to the reference: chat header buttons, model line, settings drawer */
.chat header .hbtns{display:flex;align-items:center;gap:6px}
.gear{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px;display:flex}
.gear:hover{color:var(--ink)}
.gear svg{width:20px;height:20px}
.modelline{font-size:12.5px;color:var(--muted);padding:0 12px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:fixed;inset:0;background:rgba(10,14,13,.45);z-index:39;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);color:var(--ink);border-left:1px solid var(--line);
  z-index:40;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;visibility:visible}
.drawer header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer header h2{font-size:18px}
.drawer .x{display:block}
.drawer form{flex:1;overflow-y:auto;padding:16px;display:grid;gap:12px;align-content:start}
.drawer .row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.drawer .row input{width:auto}
.drawer .sub{font-size:13px;color:var(--muted);margin:0}
.drawer .result{font-size:14px;border-radius:8px;padding:8px 10px;background:var(--sunk);margin:0}
.drawer .result.ok{border-left:4px solid var(--reno)}
.drawer .result.bad{border-left:4px solid var(--danger)}
.drawer .result:empty{display:none}
.drawer .foot2{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.drawer .foot2 div{display:flex;gap:8px}
@media (prefers-reduced-motion:no-preference){ .drawer{transition:transform .2s ease, visibility .2s} }
@media (max-width:600px){ .drawer{width:100vw;border-left:0} }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner" id="banner" role="status">Loading the board…</div>
  <header class="top">
    <div class="title">
      <h1>Project LTM</h1>
      <div class="money" id="money"></div>
      <a class="link" href="#calendar" style="display:inline-block;margin-top:6px">Jump to calendar</a>
    </div>
    <button class="keytag" id="keytag" type="button" aria-label="Set move-in date"></button>
  </header>
  <div class="nextup" id="nextup" aria-label="Coming up"></div>
  <div class="main">
    <section>
      <div class="board" id="board"></div>
      <section class="cal" id="calendar" aria-label="Calendar">
        <div class="calhead"><h2 id="calTitle"></h2>
          <div class="calnav"><button type="button" id="calPrev" aria-label="Previous month">‹</button><button type="button" id="calToday">Today</button><button type="button" id="calNext" aria-label="Next month">›</button></div>
        </div>
        <div class="grid7" id="calGrid"></div>
        <div class="agenda" id="calAgenda"></div>
      </section>
      <div class="foot">
        <button class="link" id="toggleArchived" type="button"></button>
      </div>
    </section>
    <aside class="chat" id="chat" aria-label="Chat">
      <header><h2>Tell the board</h2>
        <div class="hbtns">
          <button class="gear" id="openSettings" type="button" aria-label="Chat settings" title="Chat settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button class="x" id="closeChat" aria-label="Close chat">×</button>
        </div>
      </header>
      <div class="log" id="log"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="e.g. Carpentry quote 18k from Lim, 30% deposit due Friday"></textarea>
        <button class="btn" id="send" type="button">Send</button>
      </div>
      <div class="modelline" id="modelLine"></div>
    </aside>
  </div>
</div>
<button class="btn fab" id="fab" type="button">Tell the board</button>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Chat settings" aria-hidden="true">
  <header><h2>Chat settings</h2><button class="x" id="closeSettings" type="button" aria-label="Close settings">×</button></header>
  <form id="setForm" autocomplete="off">
    <label>Endpoint URL<input name="baseUrl" type="url" placeholder="https://…/v1" required></label>
    <label>API key<input name="apiKey" type="password" autocomplete="new-password"></label>
    <p class="sub" id="keyNote"></p>
    <label>Model<input name="model" list="modelList" required placeholder="Pick or type a model name"></label>
    <datalist id="modelList"></datalist>
    <div class="grid2">
      <label>Temperature<input name="temperature" type="number" min="0" max="1" step="0.05" required></label>
      <label>Max tokens<input name="maxTokens" type="number" min="128" max="8192" step="1" required></label>
      <label>Timeout (s)<input name="timeoutSec" type="number" min="10" max="300" step="1" required></label>
      <label>Max tool rounds<input name="maxToolRounds" type="number" min="1" max="8" step="1" required></label>
    </div>
    <label class="row"><input name="streaming" type="checkbox"> Stream replies</label>
    <p class="result" id="testResult" aria-live="polite"></p>
    <label class="row" id="saveAnywayRow" hidden><input type="checkbox" id="saveAnyway"> Save without a passing test</label>
    <p class="sub" id="setMeta"></p>
  </form>
  <div class="foot2">
    <button class="btn ghost" type="button" id="testBtn">Test connection</button>
    <div><button class="btn ghost" type="button" id="setCancel">Cancel</button><button class="btn" type="button" id="setSave" disabled>Save</button></div>
  </div>
</aside>

<dialog id="itemDlg">
  <form class="dlg" method="dialog" id="itemForm">
    <h3 id="dlgTitle">Edit item</h3>
    <label>What<input name="title" required maxlength="200"></label>
    <div class="grid2">
      <label>Category<select name="cat"></select></label>
      <label>Status<select name="status"><option value="todo">To do</option><option value="doing">In progress</option><option value="done">Done</option></select></label>
      <label>Date<input type="date" name="due"></label>
      <label>Time<input type="time" name="time"></label>
      <label>Price or quote (S$)<input type="number" name="quoted" min="0" step="0.01" inputmode="decimal"></label>
      <label>Paid (S$)<input type="number" name="paid" min="0" step="0.01" inputmode="decimal"></label>
    </div>
    <label>Vendor or contact<input name="vendor" maxlength="200"></label>
    <label>Notes<textarea name="notes" rows="3" maxlength="4000"></textarea></label>
    <div class="actions">
      <div><button class="btn danger" type="button" id="delBtn">Delete</button><button class="btn ghost" type="button" id="archBtn">Archive</button></div>
      <div><button class="btn ghost" type="button" id="cancelBtn">Cancel</button><button class="btn" type="submit" id="saveBtn">Save</button></div>
    </div>
  </form>
</dialog>

<dialog id="keyDlg">
  <form class="dlg" method="dialog" id="keyForm">
    <h3>Key dates</h3>
    <div class="grid2">
      <label>Move-in<input type="date" name="moveDate"></label>
      <label>Key collection<input type="date" name="keyDate"></label>
    </div>
    <p class="hint" style="margin:0">Both show on the calendar. The countdown follows move-in.</p>
    <div class="actions"><div></div><div><button class="btn ghost" type="button" id="keyCancel">Cancel</button><button class="btn" type="submit">Save dates</button></div></div>
  </form>
</dialog>

<script>
const CATS = [
  {id:"admin", name:"Admin", hint:"utilities, MCST, GIRO, insurance, tax, access cards, defects inspection and claims, movers, lift booking, deliveries"},
  {id:"reno", name:"Renovation", hint:"ID, contractors, quotes, permits, works"},
  {id:"shopping", name:"Shopping list", hint:"furniture, appliances, household items to buy; put the price in quoted"}
];
const CATIDS = CATS.map(c=>c.id);
const STATUS = {todo:"To do", doing:"In progress", done:"Done"};
const NEXT = {todo:"doing", doing:"done", done:"todo"};
const S = {items:[], meta:{}, etag:"", showArchived:false, loaded:false};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "S$" + Number(n||0).toLocaleString("en-SG",{maximumFractionDigits:2});
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const days = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const isDate = s => typeof s==="string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isTime = s => typeof s==="string" && /^\d{2}:\d{2}$/.test(s);
const num = v => (v===""||v==null||isNaN(Number(v))) ? null : Math.max(0, Number(v));
const catOf = i => CATIDS.includes(i.cat) ? i.cat : "admin";
const catColor = id => `var(--${CATIDS.includes(id)?id:"admin"})`;
function fmtDate(due,time){
  if(!isDate(due)) return "";
  const d = parse(due);
  const s = d.toLocaleDateString("en-SG",{weekday:"short", day:"numeric", month:"short"});
  return time ? `${s}, ${time}` : s;
}
function banner(msg){ $("banner").textContent = msg || ""; }

/* ---------- server sync ---------- */
const CONFLICT = "Someone else just changed this. Showing the latest.";
let pending = 0, pushedWhileBusy = false, bannerTimer = null;
function flash(msg){ banner(msg); clearTimeout(bannerTimer); bannerTimer = setTimeout(()=>{ if($("banner").textContent===msg) banner(""); }, 6000); }
function applyServer(snap){
  if(!snap || !snap.board) return;
  S.items = snap.board.items || []; S.meta = snap.board.meta || {}; S.etag = snap.etag || ""; S.loaded = true;
  render();
}
async function api(method, path, body){
  const r = await fetch(path, {method, headers: body!==undefined ? {"Content-Type":"application/json"} : {}, body: body!==undefined ? JSON.stringify(body) : undefined, credentials:"same-origin"});
  let data = null; try{ data = await r.json(); }catch{}
  if(!r.ok){ const e = new Error((data && data.error) || `HTTP ${r.status}`); e.status = r.status; e.data = data; throw e; }
  return data;
}
async function resync(){ try{ applyServer(await api("GET","/api/board")); }catch{} }
/* Optimistic write: change local state now, send, then take the server's board.
   While writes are in flight, pushed boards are held back so the change does
   not flicker; once they settle we fetch the latest if anything was pushed. */
async function write(localChange, method, path, body){
  localChange(); render();
  pending++;
  try{
    const res = await api(method, path, body);
    if(pending===1) applyServer(res);
    return res;
  }catch(e){
    if(e.status===409){ flash(CONFLICT); if(e.data && e.data.board) applyServer(e.data); }
    else if(e.status===400 || e.status===404){ flash(e.message); await resync(); }
    else { flash("That change didn't save. Check your connection and try again."); await resync(); }
    throw e;
  }finally{
    pending--;
    if(pending===0 && pushedWhileBusy){ pushedWhileBusy = false; resync(); }
  }
}
function clean(f){
  const o = {};
  if("title" in f) o.title = String(f.title||"").trim().slice(0,200) || "Untitled";
  if("cat" in f) o.cat = CATIDS.includes(f.cat) ? f.cat : "admin";
  if("status" in f) o.status = STATUS[f.status] ? f.status : "todo";
  if("due" in f) o.due = isDate(f.due) ? f.due : null;
  if("time" in f) o.time = isTime(f.time) ? f.time : null;
  if("quoted" in f) o.quoted = num(f.quoted);
  if("paid" in f) o.paid = num(f.paid);
  if("vendor" in f) o.vendor = String(f.vendor||"").slice(0,200);
  if("notes" in f) o.notes = String(f.notes||"").slice(0,4000);
  if("archived" in f) o.archived = !!f.archived;
  return o;
}
async function addItem(f){
  const body = clean({title:"", ...f});
  const tmp = {id:"tmp-"+Math.random().toString(36).slice(2), cat:"admin", status:"todo", due:null, time:null, quoted:null, paid:null, vendor:"", notes:"", archived:false,
    ...body, created:new Date().toISOString()};
  const res = await write(()=>S.items.push(tmp), "POST", "/api/items", body);
  return res.item.id;
}
async function updateItem(id, f){
  if(!S.items.some(i=>i.id===id)) throw new Error("No item with id " + id);
  const body = clean(f);
  await write(()=>{ S.items = S.items.map(i=>i.id===id ? {...i, ...body} : i); }, "PATCH", "/api/items/"+encodeURIComponent(id), body);
}
async function deleteItem(id){
  await write(()=>{ S.items = S.items.filter(i=>i.id!==id); }, "DELETE", "/api/items/"+encodeURIComponent(id));
}
async function setDates(f){
  const body = {};
  if("moveDate" in f) body.moveDate = isDate(f.moveDate) ? f.moveDate : null;
  if("keyDate" in f) body.keyDate = isDate(f.keyDate) ? f.keyDate : null;
  await write(()=>{ S.meta = {...S.meta, ...body}; }, "PUT", "/api/meta", body);
}

/* ---------- render ---------- */
function render(){
  const live = S.items.filter(i=>!i.archived);
  const t = today();

  // money
  const q = live.reduce((a,i)=>a+(i.quoted||0),0), p = live.reduce((a,i)=>a+(i.paid||0),0);
  $("money").innerHTML = (q||p) ? `<span>Quoted <b>${money(q)}</b></span><span>Paid <b>${money(p)}</b></span><span>Still to pay <b>${money(Math.max(0,q-p))}</b></span>`
    : "";

  // key tag
  const m = S.meta.moveDate;
  if(isDate(m)){
    const n = days(t,m);
    if(n>0) $("keytag").innerHTML = `<span class="n">${n}</span><span class="l">${n===1?"day":"days"} to move in<span>${fmtDate(m)}</span></span>`;
    else if(n===0) $("keytag").innerHTML = `<span class="n">Today</span><span class="l">Move-in day<span>Welcome home</span></span>`;
    else $("keytag").innerHTML = `<span class="n">${-n}</span><span class="l">${n===-1?"day":"days"} in the new place<span>Since ${fmtDate(m)}</span></span>`;
  } else $("keytag").innerHTML = `<span class="n">?</span><span class="l">Set your<span>move-in date</span></span>`;

  // next up
  const dated = live.filter(i=>i.status!=="done" && isDate(i.due)).sort((a,b)=>(a.due+(a.time||"")).localeCompare(b.due+(b.time||""))).slice(0,10);
  $("nextup").innerHTML = dated.map(i=>{
    const late = i.due < t;
    return `<button class="chip" style="--c:${catColor(i.cat)}" data-edit="${esc(i.id)}"><div class="d ${late?"late":""}">${late?"Overdue, ":""}${esc(fmtDate(i.due,i.time))}</div><div class="t">${esc(i.title)}</div></button>`;
  }).join("");

  // board
  const shown = S.items.filter(i=>S.showArchived || !i.archived);
  const order = {doing:0,todo:1,done:2};
  $("board").innerHTML = CATS.map(c=>{
    const list = shown.filter(i=>catOf(i)===c.id).sort((a,b)=>
      (order[a.status]-order[b.status]) || ((a.due||"9999")).localeCompare(b.due||"9999") || String(a.created||"").localeCompare(String(b.created||"")));
    const open = list.filter(i=>i.status!=="done" && !i.archived).length;
    return `<div class="col" style="--c:${catColor(c.id)}">
      <div class="colhead"><h2>${c.name}</h2><span class="count">${open} open</span></div>
      ${list.map(card).join("")}
      ${S.loaded ? `<button class="add" data-add="${c.id}">Add to ${c.name}</button>` : ""}
    </div>`;
  }).join("");

  const archived = S.items.filter(i=>i.archived).length;
  $("toggleArchived").hidden = !archived;
  $("toggleArchived").textContent = S.showArchived ? "Hide archived" : `Show archived (${archived})`;
  renderCal();
}

/* ---------- calendar ---------- */
let calMonth = (()=>{ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
function eventsByDay(){
  const map = {};
  const push = (d,e) => { (map[d] = map[d] || []).push(e); };
  if(isDate(S.meta.keyDate)) push(S.meta.keyDate, {ms:true, title:"Key collection", sort:"0"});
  if(isDate(S.meta.moveDate)) push(S.meta.moveDate, {ms:true, title:"Move in", sort:"0"});
  S.items.filter(i=>!i.archived && isDate(i.due)).forEach(i=>push(i.due, {item:i, title:i.time?`${i.time} ${i.title}`:i.title, sort:i.time||"99"}));
  Object.values(map).forEach(l=>l.sort((a,b)=>a.sort.localeCompare(b.sort)));
  return map;
}
function evHtml(e){
  if(e.ms) return `<button class="ev ms" type="button" data-dates="1">${esc(e.title)}</button>`;
  const i = e.item;
  return `<button class="ev ${i.status==="done"?"done":""}" type="button" style="--c:${catColor(i.cat)}" data-edit="${esc(i.id)}">${esc(e.title)}</button>`;
}
function renderCal(){
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  $("calTitle").textContent = calMonth.toLocaleDateString("en-SG",{month:"long", year:"numeric"});
  const map = eventsByDay(), t = today();
  const first = new Date(y, mo, 1);
  const start = new Date(y, mo, 1 - ((first.getDay()+6)%7));
  const weeks = Math.ceil((((first.getDay()+6)%7) + new Date(y, mo+1, 0).getDate())/7);
  let h = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let k=0;k<weeks*7;k++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+k), key = iso(d);
    const evs = map[key] || [];
    h += `<div class="cell ${d.getMonth()!==mo?"out":""} ${key===t?"today":""}" data-day="${key}" role="button" tabindex="0" aria-label="${d.toLocaleDateString("en-SG",{day:"numeric",month:"long"})}${evs.length?`, ${evs.length} items`:""}">
      <span class="dn">${d.getDate()}</span>${evs.slice(0,3).map(evHtml).join("")}${evs.length>3?`<span class="more">+${evs.length-3} more</span>`:""}</div>`;
  }
  $("calGrid").innerHTML = h;
  const keys = Object.keys(map).filter(k=>{ const d=parse(k); return d.getFullYear()===y && d.getMonth()===mo; }).sort();
  $("calAgenda").innerHTML = keys.length ? keys.map(k=>`<div class="day"><h3>${esc(fmtDate(k))}</h3>${map[k].map(evHtml).join("")}</div>`).join("")
    : `<p class="empty">Nothing dated this month yet.</p>`;
}
$("calPrev").onclick = ()=>{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); renderCal(); };
$("calNext").onclick = ()=>{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); renderCal(); };
$("calToday").onclick = ()=>{ const d=new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); renderCal(); };
function openDay(key){ if(S.loaded) openItem(null, "admin", key); }
$("calGrid").addEventListener("keydown", e=>{ const c=e.target.closest(".cell"); if(c && (e.key==="Enter"||e.key===" ") && e.target===c){ e.preventDefault(); openDay(c.dataset.day); } });
function card(i){
  const t = today();
  const late = isDate(i.due) && i.due < t && i.status!=="done";
  const bits = [];
  if(i.vendor) bits.push(esc(i.vendor));
  if(i.quoted!=null || i.paid!=null){
    const m=[]; if(i.quoted!=null) m.push(money(i.quoted)+" quoted"); if(i.paid!=null) m.push(money(i.paid)+" paid"); bits.push(m.join(", "));
  }
  return `<div class="card ${i.status==="done"?"done":""} ${i.archived?"archived":""}">
    <button class="ct" data-edit="${esc(i.id)}">${esc(i.title)}</button>
    ${isDate(i.due) ? `<div class="cm ${late?"late":""}">${late?"Overdue, ":""}${esc(fmtDate(i.due,i.time))}</div>` : ""}
    ${bits.length ? `<div class="cm">${bits.join("<br>")}</div>` : ""}
    <div class="crow">
      ${i.archived ? `<button class="restore" data-restore="${esc(i.id)}">Restore</button>`
        : `<button class="status" data-s="${i.status}" data-cycle="${esc(i.id)}" aria-label="Status: ${STATUS[i.status]}. Change">${STATUS[i.status]}</button>`}
    </div>
  </div>`;
}

/* ---------- chat ---------- */
const turns = [];
let busy = false, ctl = null;
function bubble(role, text){
  const d = document.createElement("div"); d.className = "msg " + role; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; return d;
}
function showHints(){
  const ex = ["We move in on 5 Dec", "Add a 3-seater sofa, budget 2k, to the shopping list", "Lim Carpentry quoted 18k, paid 30% deposit today", "What's still unpaid?"];
  const h = document.createElement("div"); h.className="hint"; h.id="hints";
  h.innerHTML = `Say what happened or what's coming up, and the board updates itself. Try:` + ex.map(x=>`<button type="button">${esc(x)}</button>`).join("");
  h.addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ $("input").value=b.textContent; send(); } });
  $("log").appendChild(h);
}
// Reads a text/event-stream response body and calls on(event, data) per event.
async function readSSE(resp, on){
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for(;;){
    const {value, done} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let k;
    while((k = buf.indexOf("\n\n")) >= 0){
      const block = buf.slice(0,k); buf = buf.slice(k+2);
      let ev = "message", data = "";
      for(const line of block.split("\n")){
        if(line.startsWith("event:")) ev = line.slice(6).trim();
        else if(line.startsWith("data:")) data += line.slice(5).trim();
      }
      if(data) on(ev, JSON.parse(data));
    }
  }
}
async function send(){
  const text = $("input").value.trim();
  if(!text || busy) return;
  $("hints")?.remove();
  $("input").value = ""; autosize();
  bubble("u", text);
  turns.push({role:"user", content:text});
  while(turns.length > 12) turns.shift();
  if(turns[0].role !== "user") turns.shift();
  const a = bubble("a", "Thinking…");
  busy = true; $("send").textContent = "Stop";
  ctl = new AbortController();
  let changes = [], reply = "", streamed = "", failed = null;
  try{
    const resp = await fetch("/api/chat", {method:"POST", signal:ctl.signal, credentials:"same-origin",
      headers:{"Content-Type":"application/json", "Accept":"text/event-stream, application/json"}, body:JSON.stringify({turns})});
    if((resp.headers.get("Content-Type")||"").startsWith("text/event-stream")){
      await readSSE(resp, (ev, d)=>{
        if(ev==="delta"){ streamed += d.text; a.textContent = streamed; }
        else if(ev==="reset"){ streamed = ""; a.textContent = "Thinking…"; }
        else if(ev==="change"){ changes.push(d.text); }
        else if(ev==="done"){ reply = d.reply; changes = d.changes || changes; if(d.model) setModelLine(d.model); }
        else if(ev==="error"){ failed = d.error; changes = d.changes || changes; }
      });
      if(!reply && !failed) failed = "The answer was cut off. Send it again.";
    } else {
      let d = {}; try{ d = await resp.json(); }catch{}
      if(resp.ok){ reply = d.reply; changes = d.changes || []; if(d.model) setModelLine(d.model); }
      else { failed = d.error || `HTTP ${resp.status}`; changes = d.changes || []; }
    }
  }catch(e){
    failed = e.name==="AbortError" ? "Stopped." : "Something interrupted that. Send it again.";
  }finally{
    if(failed){ a.textContent = (streamed ? streamed+"\n" : "") + failed; turns.pop(); }
    else { a.textContent = reply; turns.push({role:"assistant", content:reply}); }
    if(changes.length){ const c=document.createElement("span"); c.className="ch"; c.textContent=changes.join("\n"); a.appendChild(c); }
    busy = false; ctl = null; $("send").textContent = "Send"; $("log").scrollTop = $("log").scrollHeight;
  }
}
$("send").onclick = ()=>{ if(busy && ctl) ctl.abort(); else send(); };
function autosize(){ const t=$("input"); t.style.height="auto"; t.style.height=Math.min(140,t.scrollHeight)+"px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$("fab").onclick = ()=>{ $("chat").classList.add("open"); $("input").focus(); };
$("closeChat").onclick = ()=>$("chat").classList.remove("open");
function setModelLine(model){ $("modelLine").textContent = model ? "Answering: " + model : "No model set. Open settings (gear) to connect one."; }

const SF = $("setForm");
let setState = null, testedSig = null, clearKey = false;
function formVals(){
  return {baseUrl:SF.baseUrl.value.trim(), apiKey:SF.apiKey.value, clearKey: clearKey && !SF.apiKey.value, model:SF.model.value.trim(),
    temperature:Number(SF.temperature.value), maxTokens:Number(SF.maxTokens.value), timeoutSec:Number(SF.timeoutSec.value),
    maxToolRounds:Number(SF.maxToolRounds.value), streaming:SF.streaming.checked};
}
const sig = v => JSON.stringify(v);
function updateSaveBtn(){
  const passed = testedSig !== null && testedSig === sig(formVals());
  $("setSave").disabled = !(passed || $("saveAnyway").checked) || !SF.checkValidity();
  $("saveAnywayRow").hidden = passed;
}
function keyNote(){
  const v = setState || {};
  let t;
  if(clearKey) t = `The stored key will be removed on save.`;
  else if(v.keySet && v.keyFromEnv) t = `Using the key from the server's LLM_API_KEY${v.keyLast4?`, ending ${v.keyLast4}`:""}. Type a key to override it.`;
  else if(v.keySet) t = `Saved, ending ${v.keyLast4||"····"}. Leave blank to keep it.`;
  else t = `No key saved.`;
  if(!v.canStoreKey) t += " The server has no SETTINGS_SECRET, so a typed key can be tested but not saved.";
  $("keyNote").innerHTML = esc(t) + (v.keySet && !v.keyFromEnv && !clearKey ? ` <button type="button" class="link" id="clearKey">Remove stored key</button>` : "");
  SF.apiKey.placeholder = v.keySet && !clearKey ? `Saved, ending ${v.keyLast4||"····"}` : "sk-…";
}
SF.addEventListener("click", e=>{ if(e.target.id==="clearKey"){ clearKey = true; keyNote(); updateSaveBtn(); } });

SF.addEventListener("input", updateSaveBtn);
SF.baseUrl.addEventListener("change", loadModels);
$("saveAnyway").addEventListener("change", updateSaveBtn);
SF.addEventListener("submit", e=>e.preventDefault());
$("testBtn").onclick = async ()=>{
  if(!SF.reportValidity()) return;
  const v = formVals(), r = $("testResult");
  r.className = "result"; r.textContent = "Testing…"; $("testBtn").disabled = true;
  try{
    const d = await api("POST", "/api/settings/llm/test", v);
    if(d.models && d.models.length) fillModels(d.models);
    if(d.ok){ testedSig = sig(v); r.className = "result ok"; r.textContent = `Tool calling works. ${d.latencyMs} ms.` + (d.modelsError ? ` (Model list unavailable: ${d.modelsError})` : ""); }
    else { testedSig = null; r.className = "result bad"; r.textContent = d.error + (d.latencyMs ? ` (${d.latencyMs} ms)` : ""); }
  }catch(e){ testedSig = null; r.className = "result bad"; r.textContent = e.message; }
  finally{ $("testBtn").disabled = false; updateSaveBtn(); }
};
$("setSave").onclick = async ()=>{
  if($("setSave").disabled) return;
  $("setSave").disabled = true;
  try{
    setState = await api("PUT", "/api/settings/llm", formVals());
    setModelLine(setState.model); closeSettings(); flash("Chat settings saved. The next message uses " + setState.model + ".");
  }catch(e){ const r=$("testResult"); r.className="result bad"; r.textContent = e.message; updateSaveBtn(); }
};

/* ---------- boot ---------- */
render();
showHints();
api("GET","/api/settings/llm").then(v=>setModelLine(v.model)).catch(()=>{});
(function connect(){
  let opened = false, downTimer = null;
  const es = new EventSource("/api/events");
  es.addEventListener("board", e=>{
    const snap = JSON.parse(e.data);
    if(!S.loaded) banner("");
    if(pending > 0){ pushedWhileBusy = true; return; }
    applyServer(snap);
  });
  es.onopen = ()=>{ opened = true; clearTimeout(downTimer); if($("banner").textContent.startsWith("The board stopped syncing")) banner(""); };
  es.onerror = ()=>{
    // EventSource reconnects by itself; only say something if it stays down.
    clearTimeout(downTimer);
    downTimer = setTimeout(()=>{ if(es.readyState!==EventSource.OPEN) banner(opened ? "The board stopped syncing. Reconnecting…" : "Couldn't reach the board. Reload to try again."); }, 4000);
  };
})();
</script>
