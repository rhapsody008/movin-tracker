# Template only: not part of the kustomization. Fill in, then apply it out of
# band (or encrypt it with sealed-secrets / SOPS). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: movin-secrets
type: Opaque
stringData:
  # Omit both when the pod has an IAM role (IRSA) instead.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  # Default key; the settings drawer can store its own (encrypted).
  LLM_API_KEY: ""
  # Fernet key: openssl rand -base64 32 | tr '+/' '-_'
  SETTINGS_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy
type: Opaque
stringData:
  # Google Cloud console > APIs & Services > Credentials > OAuth client (Web).
  # Authorised redirect URI: https://<your host>/oauth2/callback
  OAUTH2_PROXY_CLIENT_ID: ""
  OAUTH2_PROXY_CLIENT_SECRET: ""
  # openssl rand -base64 32 | tr '+/' '-_'
  OAUTH2_PROXY_COOKIE_SECRET: ""
