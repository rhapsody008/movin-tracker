apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: { app.kubernetes.io/name: movin }
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - ../../auth
# The Secrets are not generated here: create them from secrets.example.yaml
# (kubectl apply, sealed-secrets or SOPS), so no secret lands in git.
configMapGenerator:
  - name: movin-config
    literals:
      - S3_BUCKET=zy-condo-board
      - S3_PREFIX=prod
      - AWS_REGION=ap-southeast-1
      - AUTH_HEADER=X-Forwarded-Email
      - ALLOWED_EMAILS=zy@example.com,partner@example.com
      - TZ=Asia/Singapore
      - LLM_BASE_URL=
      - LLM_MODEL=
      # Telegram allowlist defaults (Settings → Telegram replaces them):
      # people as id=name, groups as negative chat IDs.
      - TELEGRAM_ALLOWED_IDS=
      - TELEGRAM_ALLOWED_CHATS=
