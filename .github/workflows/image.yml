# Test, then build the production image and push it to GHCR; on a release
# tag, also publish the rendered manifests that Flux deploys.
#
#   pull request     -> test + build (no push)
#   push to main     -> ghcr.io/<owner>/<repo>:main, :sha-<short>, :latest
#   tag v1.2.3       -> ghcr.io/<owner>/<repo>:1.2.3, :1.2, :sha-<short>
#                       + ghcr.io/<owner>/<repo>-deploy:1.2.3 (deploy/render.sh,
#                         image pinned by digest; deploy/flux picks it up)
#   tag v1.2.3-rc.1  -> the same, but Flux ignores prereleases (a rehearsal)
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same version as `kubectl kustomize` locally; sha256 from the release's checksums.txt.
  KUSTOMIZE_VERSION: v5.8.1
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # modules are vendored

      - name: Start MinIO (conditional-write tests run against it)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done

      - name: Lint
        run: |
          out=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
          go vet ./...

      - name: Test
        env:
          S3_ENDPOINT_URL: http://localhost:9000
          S3_BUCKET: movin-test
          AWS_REGION: ap-southeast-1
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        run: go test -race -count=1 ./...

      - name: Install kustomize
        run: &kustomize |
          curl -fsSLo /tmp/kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tgz" | sha256sum -c -
          tar -xzf /tmp/kustomize.tgz -C /usr/local/bin kustomize

      # Broken manifests fail here, not at release time.
      - name: Render the manifests
        run: |
          kustomize build deploy/k8s/overlays/prod > /dev/null
          kustomize build deploy/flux > /dev/null

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The multi-arch index digest the release pins.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      # The runtime stage runs apk (poppler) for each platform.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # The converter tests on the exact poppler the image ships, per platform.
      - name: Poppler tests on the production runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: poppler-test
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Release only: render the prod manifests with the image pinned by digest
  # and publish them as an OCI artifact. Never commits to the repo.
  deploy-artifact:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Install kustomize
        run: *kustomize

      - uses: fluxcd/flux2/action@v2.8.8
        with:
          version: 2.8.8

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render
        run: deploy/render.sh "${{ needs.image.outputs.digest }}" out

      - name: Push the deploy artifact
        run: |
          flux push artifact "oci://ghcr.io/${{ github.repository }}-deploy:${GITHUB_REF_NAME#v}" \
            --path=./out \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"
