# Template only: not part of the kustomization. Create these Secrets in the
# NKP project namespace (UI or kubectl), or encrypt them with SOPS later.
# Never commit real values. After changing one, restart the pod:
#   kubectl -n movin-tracker rollout restart deploy/movin
# See docs/admin-guide.md for where each value comes from.
apiVersion: v1
kind: Secret
metadata:
  name: movin-secrets
type: Opaque
stringData:
  # An AWS key with read/write/list/delete on the bucket (NKP has no IRSA,
  # so the pod uses static keys). Rotate yearly.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  # Fernet key that encrypts the LLM key saved on the web page. Generate
  # once and keep it stable (changing it makes the saved key unreadable):
  #   openssl rand -base64 32 | tr '+/' '-_'
  SETTINGS_SECRET: ""
  # From @BotFather. Leave empty to run without the bot.
  TELEGRAM_BOT_TOKEN: ""
  # Optional: a default LLM key. Prefer entering it on the web page
  # (Settings → LLM), where it is stored encrypted. Omit for endpoints
  # without a key.
  # LLM_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy
type: Opaque
stringData:
  # GitHub → Settings → Developer settings → OAuth Apps → New OAuth App.
  # Authorization callback URL: https://<your host>/oauth2/callback
  OAUTH2_PROXY_CLIENT_ID: ""
  OAUTH2_PROXY_CLIENT_SECRET: ""
  # openssl rand -base64 32 | tr '+/' '-_'
  OAUTH2_PROXY_COOKIE_SECRET: ""
---
# cloudflared-token: the token of the tunnel zy-all-in-one-tunnel. Cloudflare
# Zero Trust -> Networks -> Tunnels -> the tunnel -> Edit: the install command
# ends in `--token eyJ...`; the token is that eyJ... string. Restart
# deploy/cloudflared after changing it.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
type: Opaque
stringData:
  token: ""
# No registry Secret: the app image and the deploy artifact are public.
