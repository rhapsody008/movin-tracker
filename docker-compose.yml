# Local stack. The app (dev and `make run`) uses the real S3 bucket from .env:
# dev and production share one bucket and no prefix (decisions.md). MinIO is
# only for the tests (`make test`, `make -C app test`) and the TS image check
# (`make -C app run`, service app-image).
#
# MinIO image: the upstream minio/minio images are no longer published, so
# this uses the community-maintained build from Pigsty. It honours If-Match
# and If-None-Match on PUT (checked by TestConditionalWrites in `make test`).

# MinIO for the tests. Fixed values: never taken from .env, so tests can't
# reach the real bucket.
x-minio-env: &minio-env
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: movin-test
  S3_PREFIX: ""
  AWS_REGION: ap-southeast-1
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"           # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    volumes:
      - minio-data:/data

  app:
    build: { context: ., target: dev }
    image: movin-dev:local
    env_file:
      - { path: .env, required: false }
    environment:
      STATIC_DIR: /src/static
      LISTEN_ADDR: ":8080"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"   # real data, no sign-in: this Mac only
    volumes:
      - .:/src
      - go-build:/root/.cache/go-build

  # `make test` / `make lint` / `make chat-eval` run here.
  test:
    profiles: [tools]
    build: { context: ., target: base }
    image: movin-test:local
    env_file:
      - { path: .env, required: false }   # only chat-eval reads it (LLM_*)
    environment:
      <<: *minio-env
    volumes:
      - .:/src
      - go-build:/root/.cache/go-build
    depends_on: [minio]

  # `make -C app test`: vitest with the S3 half against MinIO. No env_file on
  # purpose: tests must never see .env or the real bucket. Built from
  # app/Dockerfile.test: Node 24 plus poppler, so the converter tests run
  # against the real tools.
  app-test:
    profiles: [tools]
    build: { context: ., dockerfile: app/Dockerfile.test }
    image: movin-app-test:local
    working_dir: /app
    volumes:
      - ./app:/app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      <<: *minio-env
      REQUIRE_S3: "1"
      # This deployment's name for its S3 start counter, harness/<instance>/epoch.json
      # (T5.3a): dev here, prod in k8s. It is required, with no default.
      MOVIN_INSTANCE: dev
      HOME: /tmp
      # fontconfig's cache dir (as the Go production image, Dockerfile:57);
      # without it a render logs "No writable cache directories" on stderr.
      XDG_CACHE_HOME: /tmp/.cache
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    depends_on: [minio]

  # `make -C app ui-check` and app/tools/side-by-side.sh: the TS app in the
  # test image (Node 24 plus poppler), on MinIO when the caller passes its S3_*
  # as -e. Like `app`, it takes .env's LLM_* and SETTINGS_SECRET when it exists;
  # unlike `app` it is off unless the `ts` profile is asked for, so nothing runs
  # it by accident. `node src/main.ts` runs the TypeScript directly (Node 24
  # strips the types; the imports carry their .ts extension).
  app-ts:
    profiles: [ts]
    image: movin-app-test:local
    build: { context: ., dockerfile: app/Dockerfile.test }
    working_dir: /src/app
    command: ["node", "src/main.ts"]
    env_file:
      - { path: .env, required: false }
    environment:
      LISTEN_ADDR: ":8080"
      STATIC_DIR: /src/app/static
      # The dev app shares the real bucket, so its own counter keeps it away from
      # prod's (T5.3a, T5-plan §14.6).
      MOVIN_INSTANCE: dev
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      # The durable harness's SQLite file. No data volume is mounted for this
      # container, so it writes to /tmp: a throwaway chat history per run.
      DATA_DIR: /tmp/movin-data
    ports:
      - "127.0.0.1:${APP_TS_PORT:-8081}:8080"
    volumes:
      - .:/src
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

  # `make run`: the production image, locked down as in k8s.
  prod:
    profiles: [prod]
    image: movin:local
    env_file:
      - { path: .env, required: false }
    environment:
      # Published for the local check only; in k8s the app stays on
      # 127.0.0.1 behind oauth2-proxy (the code's default).
      LISTEN_ADDR: ":8080"
      GOMEMLIMIT: 128MiB
    read_only: true
    mem_limit: 256m # as in k8s (deploy/k8s/base/deployment.yaml)
    tmpfs: ["/tmp:size=16m"]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  # `make -C app run`: the v3 (TypeScript) production image, locked down as in
  # k8s (deploy/k8s/base/deployment.yaml) and built by app/Dockerfile. MinIO
  # instead of the real bucket, under its own prefix, so nothing here reaches
  # real data. No env_file on purpose: the image gets only what is written here.
  app-image:
    profiles: [image]
    image: movin-app:local
    environment:
      <<: *minio-env
      # The test bucket, under a prefix of its own, so a check run and
      # `make -C app test` never read each other's objects. Nothing creates the
      # bucket: objstore.test.ts does (CreateBucket + versioning), so run
      # `make -C app test` once against a fresh MinIO before `make run`.
      S3_BUCKET: movin-test
      S3_PREFIX: image-check
      # This deployment's name for its S3 start counter (T5.3a). No bot: a
      # token here would take the updates of the real one.
      MOVIN_INSTANCE: dev
      TELEGRAM_BOT_TOKEN: ""
      DEV_EMAIL: dev@localhost
      LISTEN_ADDR: ":8080"
      NODE_OPTIONS: --max-old-space-size=256
    read_only: true
    mem_limit: 384m # as in k8s; the poppler children share it
    tmpfs: ["/tmp:size=32m"]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:${APP_IMAGE_PORT:-8091}:8080"
    depends_on: [minio]

volumes:
  minio-data:
  go-build:
  app-data:
