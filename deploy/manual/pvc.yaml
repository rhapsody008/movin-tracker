# The chat-history volume: the durable harness's SQLite file, mounted at /data
# (deploy/k8s/base/deployment.yaml). Kept outside every kustomization on
# purpose: Flux must never create, patch or delete it, because deleting the PVC
# destroys the data (the nutanix-volume storage class has reclaim policy
# Delete). Applied by hand in T6.4:
#
#   kubectl apply -f deploy/manual/pvc.yaml -n movin-tracker
#
# No namespace here: the command names it (the NKP project owns it, as for the
# rest of the manifests). The label is what the Velero Schedule selects on
# (docs/movin-v3/velero.md), so it must stay `movin-data` and not the base
# kustomization's `movin`. It stays Pending (WaitForFirstConsumer) until the
# first v2 pod mounts it in T6.6.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: movin-data
  labels: { app.kubernetes.io/name: movin-data }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
  storageClassName: nutanix-volume
