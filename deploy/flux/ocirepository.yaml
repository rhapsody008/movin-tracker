apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: movin
  annotations:
    # NKP rewrites OCIRepositories to go through its registry mirror with its
    # own credentials; this one pulls the public artifact from ghcr.io itself.
    nkp.nutanix.com/skip-oci-registry-patches: "true"
spec:
  interval: 5m
  url: oci://ghcr.io/rhapsody008/movin-tracker-deploy
  ref:
    # Pinned to the v1 line (T6.3): a v2 tag must not deploy by itself. The
    # cutover (T6.6) changes this to the v2 release. Prereleases like
    # 1.0.0-rc.1 don't match. Roll back: an exact version, e.g. "1.0.1".
    # (semver wins over tag, so don't add a tag: here.)
    semver: "1.0.x"
