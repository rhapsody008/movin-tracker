# Production overlay. Set the host and emails here. No namespace: the NKP
# project owns it, and Flux puts these objects there (deploy/flux,
# targetNamespace). On a release, CI pins the image by digest
# (deploy/render.sh); newTag below only serves local renders.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: movin
    newName: ghcr.io/rhapsody008/movin-tracker
    newTag: "1.0.0" # git tag v1.0.0 -> image tag 1.0.0 (see .github/workflows/image.yml)
configMapGenerator:
  - name: movin-config
    behavior: merge
    literals:
      - S3_BUCKET=movintrackerbackend
      - S3_PREFIX=
      - ALLOWED_EMAILS=yizhou0514@gmail.com
      # Optional Telegram allowlist defaults; the web page (Settings →
      # Telegram) replaces them, so these can stay empty.
      - TELEGRAM_ALLOWED_IDS=8322949531=Yi,8833869288=Vicky
      - TELEGRAM_ALLOWED_CHATS=-5450579395
patches:
  - target: { kind: Deployment, name: movin }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/1/env/0/value
        value: https://movin.yolocal.cloud/oauth2/callback
