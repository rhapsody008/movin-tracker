<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin guide · Project LTM</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --sunk:#E3E8E6; --ink:#1C2321; --muted:#5D6965; --line:#D3DAD7;
  --focus:#2F6FEB; --danger:#B9483F; --brass:#C9A44C; --brass-ink:#3A2E10;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#211B17; --surface:#2C241F; --sunk:#362D27; --ink:#F2EAE1; --muted:#B8AA9C; --line:#4A3E35;
    --focus:#7AA5FF; --danger:#E07A70; --brass:#D4B25F; --brass-ink:#241C08; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211B17; --surface:#2C241F; --sunk:#362D27; --ink:#F2EAE1; --muted:#B8AA9C; --line:#4A3E35;
  --focus:#7AA5FF; --danger:#E07A70; --brass:#D4B25F; --brass-ink:#241C08; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--focus)}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top a{font-size:15px}
nav.toc{position:sticky;top:16px;font-size:14px;max-height:calc(100vh - 32px);overflow-y:auto}
nav.toc h2{font-family:var(--display);font-size:15px;margin:0 0 8px}
nav.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
nav.toc a{color:var(--muted);text-decoration:none}
nav.toc a:hover{color:var(--ink);text-decoration:underline}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,36px);min-width:0}
article h1,article h2,article h3{font-family:var(--display);line-height:1.2}
article h1{font-size:clamp(28px,4vw,38px);margin:0 0 8px;letter-spacing:-0.02em}
article h2{font-size:24px;margin:36px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
article h3{font-size:18px;margin:24px 0 6px}
article p,article ul,article ol{margin:0 0 12px}
article ul,article ol{padding-left:22px}
article li{margin:3px 0}
code{font-family:var(--mono);font-size:.88em;background:var(--sunk);border-radius:5px;padding:1px 5px;overflow-wrap:anywhere}
pre{background:var(--sunk);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:0 0 14px;font-size:14px;line-height:1.5}
pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.tbl{overflow-x:auto;margin:0 0 14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-weight:700;background:var(--sunk)}
.err{color:var(--danger)}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:18px}
  nav.toc{position:static;max-height:none}
  article{padding:16px}
  /* Wide tables scroll sideways in their own box instead of squeezing. */
  table{min-width:600px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">← Back to the board</a><a href="/#settings" id="toSettings">Open Settings</a></div>
  <nav class="toc" id="toc" aria-label="Contents"></nav>
  <article id="doc"><p>Loading the admin guide…</p></article>
</div>
<script>
/* A small Markdown renderer for docs/admin-guide.md: headings, paragraphs,
   lists, tables, fenced code, inline code, bold and links. Everything is
   escaped first, so the file cannot inject markup. */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => s.toLowerCase().replace(/<[^>]+>/g,"").replace(/&[a-z#0-9]+;/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function inline(text){
  const codes = [];
  let s = text.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length-1}\u0000`; });
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) => {
    const u = url.replace(/&amp;/g, "&");
    if(/^https?:\/\//.test(u)) return `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`;
    if(u.startsWith("#")) return `<a href="${esc(u)}">${label}</a>`;
    // Repo-relative links (deploy/..., .claude/...) only make sense in git: show the path.
    return `${label} (<code>${esc(u.replace(/^(\.\.\/)+/, ""))}</code>)`;
  });
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[Number(i)])}</code>`);
}
function render(md){
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const out = [], toc = [];
  let i = 0;
  const isTableSep = l => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  while(i < lines.length){
    const l = lines[i];
    if(/^```/.test(l)){
      const buf = []; i++;
      while(i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)$/);
    if(h){
      const level = h[1].length, html = inline(h[2]), id = slug(html);
      if(level === 2) toc.push({id, html});
      out.push(`<h${level} id="${id}">${html}</h${level}>`);
      i++; continue;
    }
    if(/^\s*\|/.test(l) && i+1 < lines.length && isTableSep(lines[i+1])){
      const head = cells(l); i += 2;
      const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<div class="tbl"><table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>`
        + rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`);
      continue;
    }
    if(/^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l)){
      const ordered = /^\s*\d+\./.test(l), items = [];
      while(i < lines.length && (ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/).test(lines[i])){
        let item = lines[i++].replace(ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/, "");
        while(i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) item += " " + lines[i++].trim();
        items.push(`<li>${inline(item)}</li>`);
      }
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
      continue;
    }
    if(!l.trim()){ i++; continue; }
    const para = [];
    while(i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|\s*\||\s*[-*]\s+|\s*\d+\.\s+)/.test(lines[i])) para.push(lines[i++].trim());
    out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return {html: out.join("\n"), toc};
}
(async ()=>{
  const doc = document.getElementById("doc");
  try{
    const r = await fetch("/api/admin/guide", {credentials:"same-origin"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const {html, toc} = render(await r.text());
    doc.innerHTML = html;
    document.getElementById("toc").innerHTML = `<h2>Contents</h2><ol>${toc.map(t=>`<li><a href="#${t.id}">${t.html}</a></li>`).join("")}</ol>`;
    if(location.hash){ document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView(); }
  }catch(e){
    doc.innerHTML = `<p class="err">Couldn't load the admin guide (${esc(e.message)}). It is also in the repo at <code>docs/admin-guide.md</code>.</p>`;
  }
})();
</script>
</body>
</html>
